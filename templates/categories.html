<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Категориями</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-body-tertiary">
    <div class="container my-4" style="max-width: 600px;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Категории</h2>
            <a href="/" class="btn btn-outline-secondary btn-sm">Назад к задачам</a>
        </div>

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <form action="/categories" method="POST" class="row g-2">
                    <div class="col-md-7">
                        <input type="text" name="name" class="form-control" placeholder="Название категории" required>
                    </div>
                    <div class="col-md-3">
                        <input type="color" name="color" class="form-control form-control-color w-100" value="#0d6efd">
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">+</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="list-group shadow-sm">
            {% for c in categories %}
            <div class="list-group-item d-flex justify-content-between align-items-center">
                <span class="badge fs-6" style="background-color: {{ c.color }}">{{ c.name }}</span>
                <a href="/categories/delete/{{ c.id }}" class="btn btn-outline-danger btn-sm border-0"><i class="bi bi-trash"></i></a>
            </div>
            {% else %}
            <div class="list-group-item text-center text-muted">Нет категорий.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
