<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h3 class="card-title text-center mb-4">Создание аккаунта</h3>
                
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    {% for message in messages %}
                      <div class="alert alert-danger py-2 mb-3">{{ message }}</div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" name="username" class="form-control" required placeholder="Придумайте логин">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required placeholder="Придумайте пароль">
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2">Зарегистрироваться</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
